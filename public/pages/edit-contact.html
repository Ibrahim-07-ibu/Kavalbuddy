<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Edit contact on Kaval Buddy" />
    <title>Kaval Buddy - Edit Contact</title>
    <link
      href="../vendor/remixicon/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../style/base.css" />
    <link rel="stylesheet" href="../style/contacts.css" />
  </head>
  <body>
    <!-- Topbar -->
    <header class="topbar" role="banner">
      <div class="logo">
        <a href="contacts.html" style="display:flex;align-items:center;gap:6px;color:var(--white);text-decoration:none;">
          <i class="ri-arrow-left-line" aria-hidden="true"></i>
          <span style="font-size:14px;">Back to Contacts</span>
        </a>
      </div>
      <div class="top-right">
        <span style="font-size:13px;color:rgba(255,255,255,0.8);">Edit Contact</span>
      </div>
    </header>

    <!-- Edit Contact Form -->
    <main class="container" role="main">
      <section class="add-contact-form" aria-label="Edit contact form">
        <div class="card">
          <h2 style="color:var(--primary);font-size:18px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px;">
            <i class="ri-edit-line" aria-hidden="true"></i>
            Edit Contact
          </h2>

          <form id="contact-form" novalidate>
            <div class="form-group">
              <label for="name">Full Name</label>
              <input
                type="text"
                id="name"
                name="name"
                placeholder="John Doe"
                autocomplete="name"
                required
                aria-required="true"
              />
            </div>

            <div class="form-group">
              <label for="phone">Mobile Number</label>
              <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="9876543210"
                pattern="[0-9]{10}"
                autocomplete="tel"
                required
                aria-required="true"
              />
            </div>

            <div class="form-group">
              <label for="relation">Relation</label>
              <select id="relation" name="relation" aria-label="Select relation">
                <option value="">Select Relation</option>
                <option value="family">Family Member</option>
                <option value="friend">Friend</option>
                <option value="neighbor">Neighbor</option>
                <option value="emergency">Emergency Service</option>
                <option value="other">Other</option>
              </select>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn-primary">
                <i class="ri-check-line" aria-hidden="true"></i>
                Save Changes
              </button>
              <a href="contacts.html" class="btn-secondary" style="text-align:center;text-decoration:none;">Cancel</a>
            </div>
          </form>
        </div>
      </section>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast" role="alert" aria-live="polite" aria-atomic="true"></div>

    <script src="../js/app.js"></script>
    <script src="../js/contacts.js"></script>
  </body>
</html>
