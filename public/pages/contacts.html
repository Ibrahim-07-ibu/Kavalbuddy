<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Manage your emergency contacts on Kaval Buddy" />
    <title>Kaval Buddy - Contacts</title>
    <link
      href="../vendor/remixicon/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../style/base.css" />
    <link rel="stylesheet" href="../style/contacts.css" />
  </head>
  <body>
    <!-- Topbar -->
    <header class="topbar" role="banner">
      <div class="logo">
        <i class="ri-shield-line" aria-hidden="true"></i>
        <span>Kaval Buddy</span>
      </div>
      <div class="top-right">
        <a class="icon-btn" href="profile.html" aria-label="Profile">
          <i class="ri-user-line" aria-hidden="true"></i>
        </a>
        <a class="icon-btn" href="settings.html" aria-label="Settings">
          <i class="ri-settings-3-line" aria-hidden="true"></i>
        </a>
      </div>
    </header>

    <!-- Contacts Header -->
    <section class="contacts-header" aria-label="Contacts header">
      <h3>
        <i class="ri-contacts-line" aria-hidden="true"></i>
        Emergency Contacts
      </h3>
      <a href="add-contact.html" class="add-btn" aria-label="Add new contact">
        <i class="ri-add-line" aria-hidden="true"></i>
        Add Contact
      </a>
    </section>

    <!-- Info Text -->
    <p class="info-text">
      These contacts will be notified automatically when you activate SOS.
    </p>

    <!-- Contact List -->
    <main class="container" role="main" style="padding:0 20px 100px;">
      <div id="contact-list" aria-label="Contact list" role="list"></div>

      <!-- Empty State -->
      <div class="empty-state" id="empty-state" aria-label="No contacts found">
        <i class="ri-contacts-line" aria-hidden="true"></i>
        <h4>No contacts yet</h4>
        <p>Add emergency contacts to notify them during SOS alerts.</p>
        <a href="add-contact.html" class="add-btn" style="display:inline-flex;" aria-label="Add your first contact">
          <i class="ri-add-line" aria-hidden="true"></i>
          Add Contact
        </a>
      </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" role="navigation" aria-label="Main navigation">
      <a href="/index.html">
        <i class="ri-home-4-line" aria-hidden="true"></i>
        <span>Dashboard</span>
      </a>
      <a href="/pages/contacts.html" class="active" aria-current="page">
        <i class="ri-contacts-line" aria-hidden="true"></i>
        <span>Contacts</span>
      </a>
      <a href="/pages/settings.html">
        <i class="ri-shield-line" aria-hidden="true"></i>
        <span>Safety</span>
      </a>
      <a href="/pages/map.html">
        <i class="ri-map-pin-line" aria-hidden="true"></i>
        <span>Map</span>
      </a>
    </nav>

    <!-- Toast Notification -->
    <div id="toast" class="toast" role="alert" aria-live="polite" aria-atomic="true"></div>

    <script src="../js/app.js"></script>
    <script src="../js/contacts.js"></script>
  </body>
</html>
