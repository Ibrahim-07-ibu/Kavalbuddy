<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Edit your Kaval Buddy profile" />
    <title>Kaval Buddy - Edit Profile</title>
    <link
      href="../vendor/remixicon/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../style/base.css" />
    <link rel="stylesheet" href="../style/profile.css" />
  </head>
  <body>
    <!-- Topbar -->
    <header class="topbar" role="banner">
      <div class="logo">
        <a href="profile.html" style="display:flex;align-items:center;gap:6px;color:var(--white);text-decoration:none;">
          <i class="ri-arrow-left-line" aria-hidden="true"></i>
          <span style="font-size:14px;">Back to Profile</span>
        </a>
      </div>
      <div class="top-right">
        <span style="font-size:13px;color:rgba(255,255,255,0.8);">Edit Profile</span>
      </div>
    </header>

    <!-- Edit Profile Content -->
    <main class="container" role="main">
      <section class="card" aria-label="Edit profile form">
        <h2 style="color:var(--primary);font-size:18px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px;">
          <i class="ri-edit-line" aria-hidden="true"></i>
          Edit Profile
        </h2>

        <form id="profile-form" novalidate>
          <!-- Profile Picture -->
          <div class="form-group" style="text-align:center;margin-bottom:20px;">
            <label for="profile-pic-input" style="cursor:pointer;">
              <img
                id="profile-pic-preview"
                src=""
                alt="Profile picture preview"
                style="width:90px;height:90px;border-radius:50%;border:2px solid var(--primary);object-fit:cover;display:none;margin:0 auto 8px;"
              />
              <div style="width:90px;height:90px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;border:2px dashed var(--border);" id="profile-pic-placeholder">
                <i class="ri-camera-line" style="font-size:24px;color:var(--text-secondary);" aria-hidden="true"></i>
              </div>
              <span style="font-size:12px;color:var(--primary);font-weight:500;">Change Photo</span>
            </label>
            <input
              type="file"
              id="profile-pic-input"
              accept="image/*"
              aria-label="Upload profile picture"
              style="display:none;"
            />
          </div>

          <div class="form-group">
            <label for="name">Full Name</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="John Doe"
              autocomplete="name"
              required
              aria-required="true"
            />
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="john@example.com"
              autocomplete="email"
              required
              aria-required="true"
            />
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="+91 98765 43210"
              autocomplete="tel"
              required
              aria-required="true"
            />
          </div>

          <div class="form-group">
            <label for="gender">Gender</label>
            <select id="gender" name="gender" aria-label="Select gender">
              <option value="">Select Gender</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
              <option value="prefer-not-to-say">Prefer not to say</option>
            </select>
          </div>

          <div class="btn-container">
            <button type="submit" class="btn-primary">Save Changes</button>
            <a href="profile.html" class="btn-secondary" style="text-align:center;text-decoration:none;">Cancel</a>
          </div>
        </form>
      </section>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast" role="alert" aria-live="polite" aria-atomic="true"></div>

    <script src="../js/app.js"></script>
    <script src="../js/profile.js"></script>
  </body>
</html>
