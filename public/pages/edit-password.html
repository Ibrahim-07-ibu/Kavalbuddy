<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Change your Kaval Buddy password" />
    <title>Kaval Buddy - Change Password</title>
    <link
      href="../vendor/remixicon/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../style/base.css" />
    <link rel="stylesheet" href="../style/profile.css" />
  </head>
  <body>
    <!-- Topbar -->
    <header class="topbar" role="banner">
      <div class="logo">
        <a href="profile.html" style="display:flex;align-items:center;gap:6px;color:var(--white);text-decoration:none;">
          <i class="ri-arrow-left-line" aria-hidden="true"></i>
          <span style="font-size:14px;">Back to Profile</span>
        </a>
      </div>
      <div class="top-right">
        <span style="font-size:13px;color:rgba(255,255,255,0.8);">Change Password</span>
      </div>
    </header>

    <!-- Change Password Content -->
    <main class="container" role="main">
      <section class="card" aria-label="Change password form">
        <h2 style="color:var(--primary);font-size:18px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px;">
          <i class="ri-lock-line" aria-hidden="true"></i>
          Change Password
        </h2>

        <form id="password-form" novalidate>
          <div class="form-group">
            <label for="currentPassword">Current Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="currentPassword"
                name="currentPassword"
                placeholder="Enter current password"
                autocomplete="current-password"
                required
                aria-required="true"
              />
              <button type="button" class="toggle-password password-toggle" aria-label="Toggle password visibility">
                <i class="ri-eye-off-line" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="newPassword">New Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="newPassword"
                name="newPassword"
                placeholder="Enter new password"
                autocomplete="new-password"
                required
                aria-required="true"
              />
              <button type="button" class="toggle-password password-toggle" aria-label="Toggle password visibility">
                <i class="ri-eye-off-line" aria-hidden="true"></i>
              </button>
            </div>
            <p class="hint">Must be at least 6 characters</p>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm New Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirm new password"
                autocomplete="new-password"
                required
                aria-required="true"
              />
              <button type="button" class="toggle-password password-toggle" aria-label="Toggle password visibility">
                <i class="ri-eye-off-line" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <div class="btn-container">
            <button type="submit" class="btn-primary">Update Password</button>
            <a href="profile.html" class="btn-secondary" style="text-align:center;text-decoration:none;">Cancel</a>
          </div>
        </form>
      </section>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast" role="alert" aria-live="polite" aria-atomic="true"></div>

    <script src="../js/app.js"></script>
    <script src="../js/profile.js"></script>
  </body>
</html>
