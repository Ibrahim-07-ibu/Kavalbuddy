<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to Kaval Buddy - Your Safety, Our Priority" />
    <title>Kaval Buddy - Login</title>
    <link
      href="../vendor/remixicon/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../style/base.css" />
    <link rel="stylesheet" href="../style/auth.css" />
  </head>
  <body>
    <!-- Auth Container -->
    <div class="auth-container">
      <!-- Logo Section -->
      <section class="logo-section">
        <i class="ri-shield-line logo-img" aria-hidden="true" style="display:flex;align-items:center;justify-content:center;font-size:48px;color:#1a3e8d;background:#e8edf5;border-radius:12px;width:80px;height:80px;margin:0 auto 12px;"></i>
        <h1>Welcome to Kaval Buddy</h1>
        <p class="tagline">Your Safety, Our Priority.</p>
      </section>

      <!-- Login Box -->
      <div class="auth-box">
        <h2>Sign in to your account</h2>
        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="john@example.com"
              autocomplete="email"
              required
              aria-required="true"
            />
            <p class="error-text" id="email-error">Please enter a valid email</p>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
                aria-required="true"
              />
              <button type="button" class="toggle-password password-toggle" aria-label="Toggle password visibility">
                <i class="ri-eye-off-line" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <div class="btn-group">
            <button type="submit" class="btn-primary">Sign In</button>
            <button type="reset" class="btn-secondary">Reset</button>
          </div>
        </form>

        <p class="link-text">
          Don't have an account?
          <a href="register.html">Register here</a>
        </p>
      </div>

      <!-- Features -->
      <div class="features" aria-label="Safety features">
        <h3>Your Safety Features</h3>
        <ul>
          <li class="feature-item">
            <span class="dot red" aria-hidden="true"></span>
            Emergency SOS
          </li>
          <li class="feature-item">
            <span class="dot green" aria-hidden="true"></span>
            Emergency Contacts
          </li>
          <li class="feature-item">
            <span class="dot blue" aria-hidden="true"></span>
            Location Tracking
          </li>
          <li class="feature-item">
            <span class="dot blue" aria-hidden="true"></span>
            Map & Routing
          </li>
        </ul>
      </div>

      <!-- Footer -->
      <footer class="auth-footer">
        <p>Secure &bull; Private &bull; Always Available</p>
      </footer>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast" role="alert" aria-live="polite" aria-atomic="true"></div>

    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
