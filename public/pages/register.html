<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create your Kaval Buddy account" />
    <title>Kaval Buddy - Register</title>
    <link
      href="../vendor/remixicon/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../style/base.css" />
    <link rel="stylesheet" href="../style/auth.css" />
  </head>
  <body>
    <!-- Topbar -->
    <header class="topbar" role="banner">
      <div class="logo">
        <i class="ri-shield-line" aria-hidden="true"></i>
        <span>Kaval Buddy</span>
      </div>
      <div class="top-right">
        <span class="text-white" style="font-size:13px;color:rgba(255,255,255,0.8);">Stay Safe</span>
      </div>
    </header>

    <!-- Register Container -->
    <main class="container" role="main">
      <section class="auth-box" style="max-width:400px;margin:0 auto;">
        <h2 style="display:flex;align-items:center;justify-content:center;gap:8px;">
          <i class="ri-user-add-line" aria-hidden="true" style="color:var(--primary);"></i>
          Create Account
        </h2>
        <form id="register-form" novalidate>
          <div class="form-group">
            <label for="name">Full Name</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="John Doe"
              autocomplete="name"
              required
              aria-required="true"
            />
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="john@example.com"
              autocomplete="email"
              required
              aria-required="true"
            />
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="+91 98765 43210"
              pattern="[0-9]{10}"
              autocomplete="tel"
              required
              aria-required="true"
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                autocomplete="new-password"
                required
                aria-required="true"
              />
              <button type="button" class="toggle-password password-toggle" aria-label="Toggle password visibility">
                <i class="ri-eye-off-line" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirm your password"
                autocomplete="new-password"
                required
                aria-required="true"
              />
              <button type="button" class="toggle-password password-toggle" aria-label="Toggle password visibility">
                <i class="ri-eye-off-line" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-primary mt-2">Register</button>
        </form>

        <p class="link-text">
          Already have an account?
          <a href="login.html">Login here</a>
        </p>
      </section>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast" role="alert" aria-live="polite" aria-atomic="true"></div>

    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
